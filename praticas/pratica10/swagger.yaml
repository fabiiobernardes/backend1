openapi: 3.0.0
info:
  title: Minha API REST
  version: 0.1
servers:
  - url: http://localhost:3000/
tags:
  - name: usuarios
paths:
  /usuarios:
    post:
      tags: [usuarios]
      summary: Cria um novo usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, senha]
              properties:
                email: { type: string, example: novo@email.com }
                senha: { type: string, example: senha123 }
      responses:
        '201':
          description: Usuário criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '422':
          description: Dados de entrada inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
  /usuarios/login:
    post:
      tags: [usuarios]
      summary: Autentica um usuário e retorna um JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usuario, senha]
              properties:
                usuario: { type: string, example: usuario@email.com }
                senha: { type: string, example: senha123 }
      responses:
        '200':
          description: Login bem-sucedido
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
  /usuarios/renovar:
    post:
      tags: [usuarios]
      summary: Renova o token JWT
      security:
        - JWTAuth: []
      responses:
        '200':
          description: Token renovado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        '401':
          description: Token inválido ou não fornecido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
  /usuarios/{id}:
    delete:
      tags: [usuarios]
      summary: Remove um usuário por ID
      security:
        - JWTAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID do usuário a ser removido
      responses:
        '204':
          description: Usuário removido com sucesso
        '401':
          description: Token inválido ou não fornecido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
components:
  schemas:
    Usuario:
      type: object
      properties:
        _id: { type: string, readOnly: true }
        email: { type: string, example: usuario@email.com }
        senha: { type: string, example: $2a$10$.... }
    Mensagem:
      type: object
      properties:
        msg: { type: string, example: Credenciais inválidas }
  securitySchemes:
    JWTAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token JWT (Bearer Token). 
      Exemplo: Bearer <token>